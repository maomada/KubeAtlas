apiVersion: v1
kind: Namespace
metadata:
  name: kuberay-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeatlas-ray-serve
  namespace: kuberay-demo
data:
  kubeatlas_serve.py: |
    from ray import serve

    @serve.deployment
    class KubeAtlasDemo:
        def __call__(self):
            return "kubeatlas-kuberay-ready"

    app = KubeAtlasDemo.bind()
