name: Package validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select package validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/package-paths.yml

  validate:
    needs: changes
    if: needs.changes.outputs.packages == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y rpm
      - name: Reclaim unused runner SDK space
        run: |
          df -h /
          for directory in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost; do
            if [ -d "$directory" ]; then
              sudo du -sh "$directory"
              sudo rm -rf -- "$directory"
            fi
          done
          df -h /
      - run: go install github.com/goreleaser/goreleaser/v2@v2.13.3
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: python3 -m unittest discover -s scripts -p 'test_release*.py'
      - name: Build and validate package matrix
        env:
          GOMAXPROCS: '2'
        run: make release-binaries-dry KUBEATLAS_RELEASE_VERSION=0.0.0-ci SOURCE_SHA="$(git rev-parse HEAD)"
      - run: |
          for package in dist/release/*.deb; do dpkg-deb --info "$package"; dpkg-deb --contents "$package"; done
          for package in dist/release/*.rpm; do rpm -qp --info "$package"; rpm -qp --list "$package"; done
          python3 scripts/release_artifacts.py validate --directory dist/release

  required-gates:
    name: Package required gates
    if: always()
    needs:
      - changes
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Emit package gate receipt
        run: python3 scripts/engineering_gate.py receipt --gate packages --output "$RUNNER_TEMP/packages.json"
      - name: Preserve package gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packages.json
          if-no-files-found: error
