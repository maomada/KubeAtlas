name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full lowercase commit SHA on main with successful CI and CodeQL
        required: true
        type: string
      version:
        description: Strict SemVer without v prefix or build metadata
        required: true
        type: string
      publish:
        description: Publish after the protected environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: owned-binary-release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require canonical repository main
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          test "$REPOSITORY" = maomada/KubeAtlas
          test "$REF" = refs/heads/main

  validate:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.policy.outputs.source_sha }}
      version: ${{ steps.policy.outputs.version }}
      ci_url: ${{ steps.policy.outputs.ci_url }}
      codeql_url: ${{ steps.policy.outputs.codeql_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - run: git -C source fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Validate source policy
        id: policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 trusted/scripts/release_policy.py --source-dir source \
            --sha "$SOURCE_SHA" --version "$VERSION" \
            > "$RUNNER_TEMP/source-evidence.json"
          python3 - "$RUNNER_TEMP/source-evidence.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          with open(sys.argv[2], "a", encoding="utf-8") as out:
              out.write(f"source_sha={evidence['sourceSha']}\n")
              out.write(f"version={evidence['version']}\n")
              out.write(f"ci_url={evidence['checks']['ci.yml']}\n")
              out.write(f"codeql_url={evidence['checks']['codeql.yml']}\n")
          PY

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install package inspection tools
        run: sudo apt-get update && sudo apt-get install --yes rpm dpkg-dev cpio
      - name: Reclaim unused runner SDK space
        run: |
          df -h /
          for directory in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost; do
            if [ -d "$directory" ]; then
              sudo du -sh "$directory"
              sudo rm -rf -- "$directory"
            fi
          done
          df -h /
      - name: Install pinned GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.13.3
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build and validate package set without publishing
        working-directory: source
        env:
          KUBEATLAS_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          RELEASE_EVIDENCE_URLS: ${{ needs.validate.outputs.ci_url }} ${{ needs.validate.outputs.codeql_url }}
        run: make release-binaries-dry RELEASE_ARTIFACT_TOOL=../trusted/scripts/release_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: kubeatlas-binary-release
          path: source/dist/release
          if-no-files-found: error
          retention-days: 14

  dry-run:
    needs: [validate, build]
    if: ${{ inputs.publish != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kubeatlas-binary-release
          path: release
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: scripts
          persist-credentials: false
      - name: Revalidate exact artifact set
        env:
          CI_URL: ${{ needs.validate.outputs.ci_url }}
          CODEQL_URL: ${{ needs.validate.outputs.codeql_url }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          sudo apt-get update && sudo apt-get install --yes rpm dpkg-dev cpio
          python3 trusted/scripts/release_artifacts.py validate --directory release \
            --source-sha "$SOURCE_SHA" \
            --version "$VERSION" \
            --evidence-url "$CI_URL" --evidence-url "$CODEQL_URL"
      - name: Record dry-run provenance
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
          CI_URL: ${{ needs.validate.outputs.ci_url }}
          CODEQL_URL: ${{ needs.validate.outputs.codeql_url }}
        run: |
          {
            echo "## Binary release dry run"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Version: \`$VERSION\`"
            echo "- CI: $CI_URL"
            echo "- CodeQL: $CODEQL_URL"
            echo "- No GitHub Release or registry write was attempted."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [validate, build]
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    environment:
      name: ghcr-publish
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - run: git -C source fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/download-artifact@v4
        with:
          name: kubeatlas-binary-release
          path: release
      - name: Revalidate source after approval
        id: source_policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git -C trusted rev-parse HEAD
          python3 trusted/scripts/release_policy.py --source-dir source \
            --sha "$SOURCE_SHA" \
            --version "$VERSION" \
            > "$RUNNER_TEMP/post-approval-source-evidence.json"
      - name: Validate hashes and metadata before writes
        id: artifacts
        env:
          CI_URL: ${{ needs.validate.outputs.ci_url }}
          CODEQL_URL: ${{ needs.validate.outputs.codeql_url }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          sudo apt-get update && sudo apt-get install --yes rpm dpkg-dev cpio
          python3 trusted/scripts/release_artifacts.py validate --directory release \
            --source-sha "$SOURCE_SHA" \
            --version "$VERSION" \
            --evidence-url "$CI_URL" --evidence-url "$CODEQL_URL"
      - name: Fail-closed tag and release collision preflight
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: python3 trusted/scripts/release_github.py --version "$VERSION" --source-sha "$SOURCE_SHA" --evidence "$RUNNER_TEMP/collision.json"
      - name: Atomically create tag ref at selected source
        id: tag_ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: python3 trusted/scripts/release_github.py --create-tag --version "$VERSION" --source-sha "$SOURCE_SHA" --evidence "$RUNNER_TEMP/tag-ref.json"
      - name: Create immutable draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "v$VERSION" --repo maomada/KubeAtlas \
            --verify-tag --draft --target "$SOURCE_SHA" \
            --title "KubeAtlas $VERSION" \
            --notes "Binary artifacts for source $SOURCE_SHA."
      - name: Upload validated artifacts
        id: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: gh release upload "v$VERSION" release/* --repo maomada/KubeAtlas
      - name: Finalize only after every upload succeeded
        id: finalize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release edit "v$VERSION" --repo maomada/KubeAtlas \
            --draft=false --latest=false "${prerelease[@]}"
      - name: Write nonsecret provenance status
        if: always()
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          ARTIFACTS: ${{ steps.artifacts.outcome }}
          SOURCE_POLICY: ${{ steps.source_policy.outcome }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          TAG_REF: ${{ steps.tag_ref.outcome }}
          DRAFT: ${{ steps.draft.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          FINALIZE: ${{ steps.finalize.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP"
          python3 - <<'PY'
          import json, os
          keys = ("SOURCE_POLICY", "ARTIFACTS", "PREFLIGHT", "TAG_REF", "DRAFT", "UPLOAD", "FINALIZE")
          result = {key.lower(): os.environ.get(key, "skipped") for key in keys}
          result.update(repository="maomada/KubeAtlas", sourceSha=os.environ.get("SOURCE_SHA", ""),
                        version=os.environ.get("VERSION", ""), workflowRun=os.environ.get("RUN_URL", ""),
                        actor=os.environ.get("ACTOR", ""))
          result["status"] = "published" if result["finalize"] == "success" else "partial-or-blocked"
          with open(os.path.join(os.environ["RUNNER_TEMP"], "release-status.json"), "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2, sort_keys=True)
              f.write("\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"## Binary release status: {result['status']}\n")
              f.write(f"- Source: `{result['sourceSha']}`\n- Version: `{result['version']}`\n")
              f.write(f"- Workflow: {result['workflowRun']}\n")
          PY
      - name: Upload nonsecret provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubeatlas-binary-release-evidence
          path: |
            ${{ runner.temp }}/collision.json
            ${{ runner.temp }}/tag-ref.json
            ${{ runner.temp }}/post-approval-source-evidence.json
            ${{ runner.temp }}/release-status.json
          if-no-files-found: warn
          retention-days: 90
