replicaCount: 1

image:
  repository: ghcr.io/maomada/kubeatlas-portal
  tag: ""
  pullPolicy: IfNotPresent

# Optional Secret for unattended administrator setup or additional Hub settings.
existingSecret: ""

# Initial HTTPS root address for Agent onboarding on a fresh Hub.
hubOrigin: ""

# Explicit trusted-network HTTP origin for a literal IPv4 or bracketed IPv6 authority.
httpIPOrigin: ""

hubArtifacts:
  # Override the catalog bundled in the release image with an existing PVC.
  enabled: false
  existingClaim: ""
  previous:
    existingClaim: ""
    version: ""

service:
  type: ClusterIP
  # Published Service port. The non-root Hub container listens on 1333.
  port: 1333

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: portal.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 1Gi

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources: {}
nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}
