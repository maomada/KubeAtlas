{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "kubeatlas-portal uses single-writer Hub state and requires replicaCount=1" }}
{{- end }}
{{- if empty .Values.image.repository }}
{{- fail "image.repository is required; build and supply a user-controlled Portal image" }}
{{- end }}
{{- if empty .Values.existingSecret }}
{{- fail "existingSecret is required and must contain keys username and password" }}
{{- end }}
{{- if and .Values.hubArtifacts.enabled (empty .Values.hubArtifacts.existingClaim) }}
{{- fail "hubArtifacts.existingClaim is required when hubArtifacts.enabled=true" }}
{{- end }}
{{- if and .Values.hubArtifacts.enabled (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .Values.hubArtifacts.existingClaim)) }}
{{- fail "hubArtifacts.existingClaim must be a Kubernetes PVC name" }}
{{- end }}
{{- $previous := .Values.hubArtifacts.previous | default dict }}
{{- $previousClaim := $previous.existingClaim | default "" }}
{{- $previousVersion := $previous.version | default "" }}
{{- $retainPrevious := or $previousClaim $previousVersion }}
{{- if $retainPrevious }}
{{- if not .Values.hubArtifacts.enabled }}
{{- fail "hubArtifacts.previous requires hubArtifacts.enabled=true" }}
{{- end }}
{{- if or (empty $previousClaim) (empty $previousVersion) }}
{{- fail "hubArtifacts.previous.existingClaim and hubArtifacts.previous.version are required together" }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $previousClaim) }}
{{- fail "hubArtifacts.previous.existingClaim must be a Kubernetes PVC name" }}
{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9.+_-]{0,127}$" $previousVersion) }}
{{- fail "hubArtifacts.previous.version must be a valid Hub artifact version" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeatlas-portal.fullname" . }}
  labels:
    {{- include "kubeatlas-portal.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubeatlas-portal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kubeatlas-portal.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kubeatlas-portal
          image: {{ include "kubeatlas-portal.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen=0.0.0.0:9290
            - --hub-state-file=/var/lib/kubeatlas-portal/hub/state.json
            {{- if .Values.hubArtifacts.enabled }}
            - --hub-artifacts-dir=/var/lib/kubeatlas-portal/artifacts
            {{- end }}
            {{- if $retainPrevious }}
            - --hub-previous-artifacts-dir=/var/lib/kubeatlas-portal/previous-artifacts
            - {{ printf "--hub-previous-artifacts-version=%s" $previousVersion | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 9290
              protocol: TCP
          env:
            {{- if .Values.httpIPOrigin }}
            - name: KUBEATLAS_PORTAL_HTTP_IP_ORIGIN
              value: {{ .Values.httpIPOrigin | quote }}
            {{- end }}
            - name: KUBEATLAS_PORTAL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: username
            - name: KUBEATLAS_PORTAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: password
            - name: KUBEATLAS_PORTAL_HUB_GROUPS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: hub-groups
                  optional: true
            - name: KUBEATLAS_PORTAL_OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: oidc-issuer
                  optional: true
            - name: KUBEATLAS_PORTAL_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: oidc-client-id
                  optional: true
            - name: KUBEATLAS_PORTAL_OIDC_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: oidc-redirect-url
                  optional: true
            - name: KUBEATLAS_PORTAL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: oidc-client-secret
                  optional: true
            - name: KUBEATLAS_PORTAL_MCP_ALLOWED_HOSTS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: mcp-allowed-hosts
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: hub-state
              mountPath: /var/lib/kubeatlas-portal
            {{- if .Values.hubArtifacts.enabled }}
            - name: hub-artifacts
              mountPath: /var/lib/kubeatlas-portal/artifacts
              readOnly: true
            {{- end }}
            {{- if $retainPrevious }}
            - name: hub-previous-artifacts
              mountPath: /var/lib/kubeatlas-portal/previous-artifacts
              readOnly: true
            {{- end }}
      volumes:
        - name: hub-state
          persistentVolumeClaim:
            claimName: {{ include "kubeatlas-portal.fullname" . }}
        {{- if .Values.hubArtifacts.enabled }}
        - name: hub-artifacts
          persistentVolumeClaim:
            claimName: {{ .Values.hubArtifacts.existingClaim }}
        {{- end }}
        {{- if $retainPrevious }}
        - name: hub-previous-artifacts
          persistentVolumeClaim:
            claimName: {{ $previousClaim | quote }}
            readOnly: true
        {{- end }}
