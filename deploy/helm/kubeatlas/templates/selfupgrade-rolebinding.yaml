{{- if .Values.rbac.selfUpgrade -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeatlas.fullname" . }}-self-upgrade
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeatlas.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeatlas.fullname" . }}-self-upgrade
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeatlas.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
