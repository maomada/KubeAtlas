suite: Service
templates:
  - service.yaml
values:
  - ci/values.yaml
tests:
  - it: base service annotations (ci/values.yaml)
    asserts:
      - equal:
          path: metadata.annotations
          value:
            svc-annotation-key: svc-annotation-value
  - it: add new service annotation
    set:
      service:
        annotations:
          external-dns.kubernetes.io/hostname: kubeatlas.example.com
    asserts:
      - equal:
          path: metadata.annotations["external-dns.kubernetes.io/hostname"]
          value: kubeatlas.example.com
      - equal:
          path: metadata.annotations
          value:
            external-dns.kubernetes.io/hostname: kubeatlas.example.com
            svc-annotation-key: svc-annotation-value
  - it: override service annotation
    set:
      service:
        annotations:
          svc-annotation-key: kubeatlas.example.com
    asserts:
      - equal:
          path: metadata.annotations["svc-annotation-key"]
          value: kubeatlas.example.com
