services:
  hub:
    image: ghcr.io/maomada/kubeatlas-portal:${KUBEATLAS_HUB_VERSION:?Set KUBEATLAS_HUB_VERSION to a published Hub image tag}
    env_file:
      - path: ${KUBEATLAS_HUB_ENV_FILE:-./hub.env}
        required: false
    command:
      - "--listen=0.0.0.0:${KUBEATLAS_HUB_CONTAINER_PORT:-1333}"
      - --hub-state-file=/var/lib/kubeatlas-portal/hub/state.json
    volumes:
      - hub-state:/var/lib/kubeatlas-portal
    ports:
      - "127.0.0.1:${KUBEATLAS_HUB_PORT:-1333}:${KUBEATLAS_HUB_CONTAINER_PORT:-1333}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  hub-state:
